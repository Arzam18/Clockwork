name: Android ARM64 NEON

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Clockwork for Android ARM64
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build unzip

      - name: Install Android NDK r30
        run: |
          set -euo pipefail
          NDK_ARCHIVE="$RUNNER_TEMP/android-ndk-r30-linux.zip"
          curl -fL --retry 3 \
            https://dl.google.com/android/repository/android-ndk-r30-linux.zip \
            -o "$NDK_ARCHIVE"
          echo "5107f898313790e449e87eee2183d9a20602dee9  $NDK_ARCHIVE" | sha1sum -c -
          unzip -q "$NDK_ARCHIVE" -d "$RUNNER_TEMP"
          echo "ANDROID_NDK_HOME=$RUNNER_TEMP/android-ndk-r30" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/android-ndk-r30/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Verify ARM NEON and Dotprod compiler support
        run: |
          set -euo pipefail
          CXX="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++"
          MACROS="$("$CXX" -march=armv8.2-a+dotprod -mtune=cortex-a76 -dM -E -x c++ /dev/null)"
          grep -q '^#define __ARM_NEON 1$' <<< "$MACROS"
          grep -q '^#define __ARM_FEATURE_DOTPROD 1$' <<< "$MACROS"
          echo "ARM NEON and Dotprod are enabled."

      - name: Configure Android ARM64 build
        run: |
          set -euo pipefail
          cmake -S . -B build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS=-mtune=cortex-a76 \
            -DCLOCKWORK_MARCH_TARGET=armv8.2-a+dotprod \
            -DCLOCKWORK_ENABLE_EVALTUNE=OFF

      - name: Build Clockwork
        run: |
          set -euo pipefail
          cmake --build build-android --target clockwork --parallel 2
          cp build-android/clockwork clockwork-android-arm64-neon
          chmod +x clockwork-android-arm64-neon

      - name: Verify Android binary
        run: |
          set -euo pipefail
          file clockwork-android-arm64-neon
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h clockwork-android-arm64-neon
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h clockwork-android-arm64-neon | grep -q "AArch64"

      - name: Upload Android ARM64 binary
        uses: actions/upload-artifact@v4
        with:
          name: clockwork-android-arm64-neon
          path: clockwork-android-arm64-neon
          if-no-files-found: error
